<main class="wrap dash" id="dash"></main>

<dialog id="dlg" class="dlg" aria-labelledby="dlgTitle"><div class="dlg-in"><p class="dlg-brand">Automotive Service</p><h2 id="dlgTitle"></h2><p class="sub" id="dlgNote"></p><div id="dlgBody"></div><div class="dlg-acts" id="dlgActs"></div></div></dialog>

<script src="auth.js"></script>
<script src="app.js"></script>
<script>
(function(){
if(!guard('admin'))return;
wireNav();
var root=document.getElementById('dash');
var top=h('div','dash-top');
var t=h('div');t.appendChild(h('h1','','Customers'));t.appendChild(h('p','sub','Everyone with a customer account.'));top.appendChild(t);root.appendChild(top);
var bar=h('div','toolbar');
var q=h('input');q.placeholder='Search name, email or mobile';q.setAttribute('aria-label','Search customers');bar.appendChild(q);root.appendChild(bar);
var holder=h('div');root.appendChild(holder);
function draw(){
 holder.textContent='';
 var all=customersList(),needle=q.value.trim().toLowerCase();
 var rows=all.filter(function(u){return !needle||[u.name,u.email,u.phone].join(' ').toLowerCase().indexOf(needle)>-1});
 if(!rows.length){holder.appendChild(empty(all.length?'No customers match your search.':'No customer accounts yet.'));return}
 holder.appendChild(table(['Name','Email','Mobile','Bookings',''],customerRows(rows)));
}
q.addEventListener('input',draw);
draw();
})();
</script>
